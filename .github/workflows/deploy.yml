name: Build and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync docs folder
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/. docs/
      - name: Commit built site
        run: |
          git config user.name "workstation-bot"
          git config user.email "workstation-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No site changes, skip commit"
          else
            git commit -m "build: update site"
            git push origin main
          fi
