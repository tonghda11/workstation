<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的工作站</title>
    <meta
      name="description"
      content="个人工作站：木盒里叠放的便利贴，搜索、常用网站、自选行情、打卡日历与环境设备信息。"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      body {
        margin: 0;
        background-color: #3a2110;
        background-image:
          radial-gradient(900px 520px at 50% -12%, rgb(255 214 160 / 0.2), transparent 70%),
          linear-gradient(96deg, #2a1709, #4b2d15 38%, #2a1709);
      }
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 62vh;
        gap: 12px;
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e8d6b8;
      }
      .app-loading-mark {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: linear-gradient(180deg, #f0d49a, #d9b26a 55%, #a97f3f);
        color: #3a2410;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 700;
        box-shadow: 0 8px 18px rgb(0 0 0 / 0.45);
      }
      .app-loading-btn {
        margin-top: 4px;
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid rgb(240 219 184 / 0.4);
        background: transparent;
        color: inherit;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ws.theme");
          var query = new URLSearchParams(window.location.search);
          var forced = query.get("theme");
          var dark = forced
            ? forced === "dark"
            : saved
              ? saved === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <script>
      window.addEventListener("error", function () {
        var root = document.getElementById("root");
        if (root && root.querySelector("#app-loading")) {
          root.innerHTML =
            '<div id="app-loading"><div class="app-loading-mark">工</div>' +
            "<p>加载失败，请检查网络后重试</p>" +
            '<button class="app-loading-btn" onclick="location.reload()">刷新页面</button></div>';
        }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-BJNw2ale.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-B0Z9INg1.js">
    <link rel="modulepreload" crossorigin href="./assets/react-JBdU6nFZ.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CWyQGMOj.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div class="app-loading-mark">工</div>
        <p>正在加载工作站…</p>
      </div>
    </div>
    <noscript>
      <div id="app-loading">
        <div class="app-loading-mark">工</div>
        <p>请启用 JavaScript 后访问本网站。</p>
      </div>
    </noscript>
  </body>
</html>
